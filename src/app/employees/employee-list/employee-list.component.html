<h2>Employee List</h2>
<p>Search</p>
<input style="margin-bottom: 20px" [formControl]="searchValue" />
<br />
<button
  [routerLink]="'add'"
  style="background-color: darkmagenta"
  type="button"
>
  Add Employee
</button>
@if (users.length) {
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Blood</th>
        <th>Age</th>
        <th>View</th>
        <th>Edit</th>
        <th>Delete</th>
      </tr>
    </thead>
    <tbody>
      @for (user of users; track user.id) {
        <tr>
          <td>{{ user.firstName }}</td>
          <td>{{ user.email }}</td>
          <td>{{ user.bloodGroup }}</td>
          <td>{{ user.age }}</td>
          <td>
            <button class="view" [routerLink]="user.id" type="button">
              View
            </button>
          </td>
          <td>
            <button class="edit" [routerLink]="'edit/' + user.id" type="button">
              Edit
            </button>
          </td>
          <td>
            <button class="delete" type="button">Delete</button>
          </td>
        </tr>
      }
    </tbody>
  </table>
}
